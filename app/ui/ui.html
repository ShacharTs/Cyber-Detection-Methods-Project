<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ML Inference Dashboard - Worker Edition</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:rgba(255,255,255,.07);
      --panel2:rgba(255,255,255,.10);
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --ok:#34d399;
      --bad:#fb7185;
      --warn:#fbbf24;
      --accent:#7c3aed;
      --accent2:#22d3ee;
      --shadow:0 18px 60px rgba(0,0,0,.45);
      --radius:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text); font-family:var(--sans);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(124,58,237,0.35), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(34,211,238,0.25), transparent 55%),
        radial-gradient(900px 500px at 60% 120%, rgba(52,211,153,0.16), transparent 55%),
        var(--bg);
    }
    a{color:inherit}
    .wrap{max-width:1100px; margin:0 auto; padding:28px 18px 48px;}
    .header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px;}
    h1{margin:0; font-size:22px}
    .subtitle{margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.35}
    .pills{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 10px; border-radius:999px;
      border:1px solid var(--stroke); background:rgba(255,255,255,.05);
      font-size:12px; color:var(--muted);
    }
    .dot{width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.35);}
    .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}

    .card{
      border-radius:var(--radius);
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .top{
      padding:14px 16px; border-bottom:1px solid var(--stroke);
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      background:rgba(0,0,0,.12);
    }
    .top h2{margin:0; font-size:14px; color:rgba(255,255,255,.88)}
    .body{padding:14px 16px 16px;}
    .controls{
      display:grid; grid-template-columns:1fr; gap:10px; padding:14px 16px 16px;
    }
    @media (min-width:760px){ .controls{grid-template-columns:1.2fr .6fr .8fr;} }
    label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
    input[type="text"], input[type="number"]{
      width:100%; padding:11px 12px; border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      color:var(--text);
      outline:none;
    }
    input:focus{border-color:rgba(124,58,237,.6); box-shadow:0 0 0 4px rgba(124,58,237,.15);}

    .btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    button{
      border:1px solid var(--stroke); background:rgba(255,255,255,.07); color:var(--text);
      padding:10px 12px; border-radius:14px; cursor:pointer; font-weight:700; font-size:13px;
    }
    button.primary{
      border-color:rgba(124,58,237,.55);
      background:linear-gradient(90deg, rgba(124,58,237,.9), rgba(34,211,238,.65));
    }
    button:disabled{opacity:.55; cursor:not-allowed;}

    .grid{display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px;}
    @media (min-width:960px){ .grid{grid-template-columns:1.05fr .95fr;} }

    .drop{
      border:1px dashed rgba(255,255,255,.20); background:rgba(255,255,255,.04);
      border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px;
    }
    .filemeta{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted);}

    .stats{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
    @media (min-width:520px){ .stats{grid-template-columns:1fr 1fr;} }
    .stat{ padding:12px; border-radius:16px; border:1px solid var(--stroke); background:rgba(255,255,255,.05); }
    .stat .k{font-size:12px; color:var(--muted); margin-bottom:6px;}
    .stat .v{font-size:18px; font-weight:900;}

    .accBadge{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18); margin-top:12px;
    }
    .accBadge.ok{border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.08);}
    .accBadge.bad{border-color:rgba(251,113,133,.35); background:rgba(251,113,133,.08);}

    pre{
      margin:0; padding:12px; border-radius:16px; border:1px solid var(--stroke);
      background:rgba(0,0,0,.18); overflow:auto; font-family:var(--mono); font-size:12px;
    }
    .linkbtn{
      display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      border-radius:14px; border:1px solid rgba(34,211,238,.55); background:rgba(34,211,238,.12);
      padding:10px 12px; font-weight:900; font-size:13px; margin-top:10px;
    }
    .toast{
      position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:10px; z-index:99;
    }
    .toast .msg{
      width:min(420px, calc(100vw - 32px)); padding:12px; border-radius:16px;
      border:1px solid var(--stroke); background:rgba(0,0,0,.80); box-shadow:var(--shadow);
      display:flex; gap:10px; align-items:flex-start; animation:pop .18s ease-out;
    }
    @keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>ML Inference Dashboard</h1>
        <p class="subtitle">Distributed Worker Architecture: Backend queues tasks while Workers process results.</p>
        <div class="pills">
          <div class="pill"><span class="dot" id="dotApi"></span><span id="apiStatus">API: unknown</span></div>
          <div class="pill"><span class="dot warn" id="dotModel"></span><span id="modelStatus">Model: unknown</span></div>
        </div>
      </div>
      <div class="btnrow">
        <button id="btnHealth" class="primary">Check health</button>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <div>
          <label for="baseUrl">API Base URL</label>
          <input id="baseUrl" type="text" placeholder="e.g. http://localhost:8000" />
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="top">
          <h2>Worker Status: <span id="workerStatus">Idle</span></h2>
          <div class="btnrow">
            <button id="btnChoose">Choose CSV</button>
            <input id="csvFile" type="file" accept=".csv" style="display:none;" />
          </div>
        </div>
        <div class="body">
          <div class="drop" id="dropZone">
            <div id="fileMeta"><span>No file selected</span></div>
            <div class="btnrow">
              <button id="btnUpload" class="primary" disabled>Start Worker</button>
              <button id="btnClear" disabled>Clear</button>
            </div>
          </div>

          <div id="accBadge" class="accBadge na" style="display:none;">
            <div class="big" style="font-size:22px; font-weight:900;" id="accBig">—</div>
            <div class="meta" id="accMeta">Accuracy</div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="k">Rows</div>
              <div class="v" id="rowsOut">—</div>
            </div>
            <div class="stat">
              <div class="k">Job ID</div>
              <div class="v" style="font-size:12px; overflow:hidden;" id="jobIdOut">—</div>
            </div>
          </div>

          <a class="linkbtn" id="downloadBtn" href="#" style="display:none;" download>Download Result</a>
        </div>
      </div>

      <div class="card">
        <div class="top"><h2>Live Logs</h2></div>
        <div class="body">
          <pre id="outPre">Waiting for task...</pre>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  function base() { return $("baseUrl").value.trim().replace(/\/+$/, ""); }
  function show(obj) { $("outPre").textContent = JSON.stringify(obj, null, 2); }

  function toast(type, title, body) {
    const wrap = $("toast");
    const el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = `<div><div style="font-weight:900;">${title}</div><div style="font-size:12px; color:var(--muted);">${body}</div></div>`;
    wrap.appendChild(el);
    setTimeout(() => { el.remove(); }, 3600);
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    return data;
  }

  // Polling Logic
  async function pollStatus(jobId) {
    const btn = $("btnUpload");
    const statusText = $("workerStatus");
    const url = `${base()}/status/${jobId}`;

    const interval = setInterval(async () => {
      try {
        const data = await fetchJSON(url);
        show(data);

        if (data.status === "completed") {
          clearInterval(interval);
          statusText.textContent = "Done";
          btn.disabled = false;
          btn.textContent = "Start Worker";

          // Update Stats
          $("rowsOut").textContent = data.n_rows;
          $("accBig").textContent = data.accuracy ? (data.accuracy * 100).toFixed(2) + "%" : "N/A";
          $("accBadge").style.display = "flex";
          $("accBadge").className = "accBadge " + (data.accuracy >= 0.5 ? "ok" : "bad");

          // Set Download
          const dBtn = $("downloadBtn");
          dBtn.href = `${base()}/download/${jobId}`;
          dBtn.style.display = "inline-flex";

          toast("ok", "Worker Finished", `Processed ${data.n_rows} rows.`);
        }
      } catch (e) {
        clearInterval(interval);
        statusText.textContent = "Error";
        btn.disabled = false;
        toast("bad", "Polling Failed", e.message);
      }
    }, 2000); // Poll every 2 seconds
  }

  // Upload Logic
  $("btnUpload").addEventListener("click", async () => {
    const file = $("csvFile").files[0];
    if (!file) return;

    const btn = $("btnUpload");
    btn.disabled = true;
    btn.textContent = "Queueing...";
    $("workerStatus").textContent = "Queueing...";

    try {
      const form = new FormData();
      form.append("file", file);

      // Initial request starts the worker
      const data = await fetchJSON(base() + "/process_csv", { method: "POST", body: form });
      show(data);

      $("jobIdOut").textContent = data.job_id;
      $("workerStatus").textContent = "Processing...";
      pollStatus(data.job_id);

    } catch (e) {
      show({ error: e.message });
      btn.disabled = false;
      btn.textContent = "Start Worker";
      toast("bad", "Failed to queue", e.message);
    }
  });

  // UI Helpers
  $("btnChoose").addEventListener("click", () => $("csvFile").click());
  $("csvFile").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) {
      $("fileMeta").textContent = `Selected: ${f.name} (${Math.round(f.size/1024)} KB)`;
      $("btnUpload").disabled = false;
      $("btnClear").disabled = false;
    }
  });

  $("btnHealth").addEventListener("click", async () => {
    try {
      const data = await fetchJSON(base() + "/health");
      $("dotApi").className = "dot ok";
      $("apiStatus").textContent = "API: Online";
      show(data);
      toast("ok", "Health Check", "Backend is reachable.");
    } catch (e) {
      $("dotApi").className = "dot bad";
      toast("bad", "Offline", e.message);
    }
  });
</script>
</body>
</html>
