<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NPM Hybrid Security Engine | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#0b1020; --card:#1e293b; --stroke:rgba(255,255,255,0.08);
      --accent:#7c3aed; --accent2:#22d3ee; --ok:#34d399; --bad:#fb7185; --radius:24px;
    }
    body{ margin:0; background:var(--bg); color:#f1f5f9; font-family:'Inter', sans-serif; overflow-y:auto; padding-bottom:80px; }
    .container{ max-width: 1200px; margin: 0 auto; padding: 60px; }

    .dashboard-grid { display: grid; grid-template-columns: 350px 1fr; gap: 50px; margin-bottom: 50px; }
    .card {
      background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius);
      padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); position: relative;
    }

    h1 { margin:0; font-size:28px; font-weight:900; }
    h2 { font-size: 13px; color: var(--accent2); text-transform: uppercase; letter-spacing: 2px; margin-top:0; }

    .results-area { display: none; }
    .section-sep { margin: 100px 0 50px 0; padding-top: 50px; border-top: 1px solid var(--stroke); display:none; }

    .m-table { width: 100%; border-collapse: collapse; margin-top: 25px; }
    .m-table th { text-align: left; font-size: 11px; color: rgba(255,255,255,0.4); padding-bottom: 15px; }
    .m-table td { padding: 18px 0; border-bottom: 1px solid var(--stroke); font-size: 15px; }
    .val-highlight { color: var(--ok); font-weight: 800; font-size: 18px; }

    button { background: var(--accent); color:#fff; border:none; padding:15px 25px; border-radius:14px; cursor:pointer; font-weight:bold; width:100%; transition:0.2s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .save-btn { position: absolute; top: 20px; right: 20px; width:auto; padding:6px 12px; font-size:10px; background:rgba(255,255,255,0.05); border:1px solid var(--accent2); color:var(--accent2); border-radius:10px; z-index: 10; }

    .status-badge { opacity:0.6; font-weight:bold; letter-spacing:1px; border:1px solid var(--accent2); padding:6px 15px; border-radius:10px; transition: 0.3s; }
    .status-active { border-color: var(--bad); color: var(--bad); animation: pulse 1.5s infinite; }

    .mode-tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; margin-bottom: 15px; border: 1px solid; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:60px;">
      <div>
        <h1>NPM Hybrid Security Engine</h1>
        <p style="opacity:0.5; font-size:14px; margin-top:5px;">Final Project 2026 | Shachar Tsrafati & Eitan Beriy</p>
      </div>
      <div id="status" class="status-badge">SYSTEM: READY</div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h2>Actions</h2>
        <button id="btnChoose" style="background:#334155; margin-bottom:15px;">📁 Select Dataset</button>
        <button id="btnUpload" disabled>🚀 Run Analysis</button>
        <input type="file" id="csvFile" style="display:none;" />

        <div id="resultActions" class="results-area" style="margin-top: 30px;">
            <a id="dlBtn" href="#" style="text-decoration:none;">
                <button style="background:transparent; border:2px solid var(--ok); color:var(--ok);">📥 Export Detailed CSV</button>
            </a>
        </div>
      </div>

      <div id="metricsCard" class="card results-area">
        <button class="save-btn" onclick="saveCard('metricsCard')">DOWNLOAD PNG</button>
        <h2 id="metricsTitle">Analysis Results</h2>
        <div id="modeTag" class="mode-tag"></div>
        <table class="m-table">
          <thead id="metricsHead"></thead>
          <tbody id="metricsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section-sep results-area"><h2>1. Strategic Insight Analysis</h2></div>
    <div class="card results-area">
        <button class="save-btn" onclick="saveChart('perfChart')">DOWNLOAD PNG</button>
        <div style="height:400px;"><canvas id="perfChart"></canvas></div>
    </div>

    <div class="section-sep results-area"><h2>2. Detection Strategy Distribution</h2></div>
    <div id="chartSection2" class="results-area" style="grid-template-columns: 1fr 1fr; gap:50px;">
        <div class="card">
            <button class="save-btn" onclick="saveChart('distChart')">DOWNLOAD PNG</button>
            <div style="height:350px;"><canvas id="distChart"></canvas></div>
        </div>
        <div id="overlapCard" class="card">
            <button class="save-btn" onclick="saveChart('overlapChart')">DOWNLOAD PNG</button>
            <div style="height:350px;"><canvas id="overlapChart"></canvas></div>
        </div>
    </div>

    <div class="section-sep results-area"><h2>3. Behavioral Intensity (Feature Analysis)</h2></div>
    <div class="card results-area" style="height: 750px;">
        <button class="save-btn" onclick="saveChart('freqChart')">DOWNLOAD PNG</button>
        <div style="height:100%;"><canvas id="freqChart"></canvas></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let charts = {};

  const UI_LABELS = {
    'weaklink': 'WeakLink', 'donpai': 'DonPai',
    'combined': 'Hybrid (XGB)', 'combined_voting': 'Voting Ensemble'
  };

  async function poll(jobId) {
    const itv = setInterval(async () => {
      try {
        const res = await fetch(`/status/${jobId}`);
        const data = await res.json();

        if(data.status === "completed") {
          clearInterval(itv);
          $("status").textContent = "ANALYSIS COMPLETE";
          $("status").classList.remove("status-active");

          document.querySelectorAll('.results-area, .section-sep').forEach(e => {
              if (e.id === 'chartSection2') e.style.display = 'grid';
              else e.style.display = 'block';
          });

          renderUI(data);
        }
      } catch (e) { console.error(e); }
    }, 2000);
  }

  function renderUI(data) {
    const body = $("metricsBody");
    const head = $("metricsHead");
    const tag = $("modeTag");
    body.innerHTML = "";

    if(data.has_ground_truth) {
        // Mode: Evaluation
        $("metricsTitle").textContent = "Performance Benchmarks";
        tag.textContent = "MODE: EVALUATION (LABELS FOUND)";
        tag.style.borderColor = "var(--ok)";
        tag.style.color = "var(--ok)";

        head.innerHTML = `<tr><th>Strategy</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>F1-Score</th></tr>`;

        const models = Object.keys(data.all_metrics);
        models.forEach(m => {
            const v = data.all_metrics[m];
            body.innerHTML += `<tr>
                <td style="font-weight:bold;">${UI_LABELS[m] || m}</td>
                <td class="val-highlight">${(v.accuracy*100).toFixed(1)}%</td>
                <td>${(v.precision*100).toFixed(1)}%</td>
                <td>${(v.recall*100).toFixed(1)}%</td>
                <td style="color:var(--accent2); font-weight:800;">${(v.f1_score*100).toFixed(1)}%</td>
            </tr>`;
        });

        renderMainChart(data, true);
    } else {
        // Mode: Prediction Intelligence
        $("metricsTitle").textContent = "Predictive Intelligence Summary";
        tag.textContent = "MODE: INFERENCE (LABELS MISSING)";
        tag.style.borderColor = "var(--accent2)";
        tag.style.color = "var(--accent2)";

        head.innerHTML = `<tr><th>Strategy</th><th>Total Samples</th><th>Malicious Flags</th><th>Benign Flags</th><th>Detection Rate</th></tr>`;

        const predModels = Object.keys(data.prediction_stats).filter(k => k in UI_LABELS);
        predModels.forEach(m => {
            const s = data.prediction_stats[m];
            const total = s.malicious + s.benign;
            const rate = ((s.malicious / total) * 100).toFixed(1);
            body.innerHTML += `<tr>
                <td style="font-weight:bold;">${UI_LABELS[m] || m}</td>
                <td>${total}</td>
                <td style="color:var(--bad); font-weight:bold;">${s.malicious}</td>
                <td style="color:var(--ok);">${s.benign}</td>
                <td class="val-highlight">${rate}%</td>
            </tr>`;
        });

        renderMainChart(data, false);
    }

    renderSecondaryCharts(data);
    $("dlBtn").href = `/download/${data.job_id}`;
  }

  function renderMainChart(data, isEval) {
    if(charts.perf) charts.perf.destroy();
    const ctx = $("perfChart").getContext('2d');

    if(isEval) {
        const models = Object.keys(data.all_metrics);
        charts.perf = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: models.map(m => UI_LABELS[m] || m),
                datasets: [
                    { label: 'Accuracy', data: models.map(m => (data.all_metrics[m].accuracy*100).toFixed(1)), backgroundColor: '#7c3aed' },
                    { label: 'F1-Score', data: models.map(m => (data.all_metrics[m].f1_score*100).toFixed(1)), backgroundColor: '#34d399' }
                ]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{labels:{color:'#fff'}} }, scales:{ y:{ beginAtZero:true, max:100, ticks:{color:'#fff'}, grid:{color:'rgba(255,255,255,0.05)'}}, x:{ticks:{color:'#fff'}} } }
        });
    } else {
        const predModels = Object.keys(data.prediction_stats).filter(k => k in UI_LABELS);
        charts.perf = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: predModels.map(m => UI_LABELS[m] || m),
                datasets: [
                    { label: 'Malicious Detected', data: predModels.map(m => data.prediction_stats[m].malicious), backgroundColor: '#fb7185' },
                    { label: 'Benign Detected', data: predModels.map(m => data.prediction_stats[m].benign), backgroundColor: '#34d399' }
                ]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{labels:{color:'#fff'}} }, scales:{ y:{ beginAtZero:true, ticks:{color:'#fff'}, grid:{color:'rgba(255,255,255,0.05)'}}, x:{ticks:{color:'#fff'}} } }
        });
    }
  }

  function renderSecondaryCharts(data) {
    // 2. Overlap UI
    const oData = data.prediction_stats.overlap_analysis;
    if(oData) {
        if(charts.overlap) charts.overlap.destroy();
        charts.overlap = new Chart($("overlapChart"), {
            type: 'doughnut',
            data: {
                labels: Object.keys(oData),
                datasets: [{ data: Object.values(oData), backgroundColor: ['#34d399', '#7c3aed', '#22d3ee', '#fb7185'], borderWidth:0 }]
            },
            options: { maintainAspectRatio:false, cutout:'70%', plugins:{ legend:{position:'bottom', labels:{color:'#fff', font:{size:10}}} } }
        });
    }

    // 3. Feature Intensity UI
    const fData = data.prediction_stats.feature_analysis;
    if(charts.freq) charts.freq.destroy();
    charts.freq = new Chart($("freqChart"), {
        type: 'bar',
        data: {
            labels: Object.keys(fData.mal_count),
            datasets: [
                { label: 'Malicious', data: Object.values(fData.mal_count), backgroundColor: '#fb7185' },
                { label: 'Benign', data: Object.values(fData.ben_count), backgroundColor: '#34d399' }
            ]
        },
        options: { indexAxis:'y', maintainAspectRatio:false, scales:{ x:{grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#fff'}}, y:{ticks:{color:'#fff', font:{size:10}}} }, plugins:{legend:{labels:{color:'#fff'}}} }
    });

    // 4. Model Prediction Distribution
    const predModels = Object.keys(data.prediction_stats).filter(k => k in UI_LABELS);
    if(charts.dist) charts.dist.destroy();
    charts.dist = new Chart($("distChart"), {
        type: 'bar',
        data: {
            labels: predModels.map(m => UI_LABELS[m] || m),
            datasets: [
                { label: 'Malicious', data: predModels.map(m => data.prediction_stats[m].malicious), backgroundColor: '#fb7185' },
                { label: 'Benign', data: predModels.map(m => data.prediction_stats[m].benign), backgroundColor: '#34d399' }
            ]
        },
        options: { maintainAspectRatio:false, scales:{ x:{stacked:true, ticks:{color:'#fff'}}, y:{stacked:true, ticks:{color:'#fff'}} }, plugins:{legend:{labels:{color:'#fff'}}} }
    });
  }

  function saveChart(id) {
    const link = document.createElement('a');
    link.download = `${id}.png`;
    link.href = $(id).toDataURL('image/png');
    link.click();
  }

  function saveCard(id) {
    const el = $(id);
    const btn = el.querySelector('.save-btn');
    btn.style.opacity = '0';
    html2canvas(el, { backgroundColor: "#1e293b", borderRadius: 24, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `analysis_summary.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.style.opacity = '1';
    });
  }

  $("btnChoose").onclick = () => $("csvFile").click();
  $("csvFile").onchange = (e) => {
    if(e.target.files[0]) {
      $("btnUpload").disabled = false;
      $("btnChoose").textContent = `📄 ${e.target.files[0].name}`;
    }
  };

  $("btnUpload").onclick = async () => {
    const file = $("csvFile").files[0];
    if(!file) return;
    const f = new FormData();
    f.append("file", file);
    f.append("strategy", "combined");

    $("status").textContent = "ANALYZING...";
    $("status").classList.add("status-active");
    $("btnUpload").disabled = true;

    try {
        const r = await fetch("/process_csv", { method: "POST", body: f });
        const d = await r.json();
        if(d.job_id) poll(d.job_id);
    } catch (err) {
        $("status").textContent = "ERROR";
        $("btnUpload").disabled = false;
    }
  };
</script>
</body>
</html>
